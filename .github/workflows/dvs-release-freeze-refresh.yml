name: DVS Release Freeze Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dvs-release-freeze-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh only validated DVS blob in V1 release freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('RELEASE_FREEZE_V1.1.0.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          blobs=data['protected_git_blobs']
          old='ca366ed16979581cafb6081cdece1cf0858c44fa'
          new='2b7417050d7ab913918f448e077efdafd5f58229'
          assert blobs.get('src/sources/shared/dvs.py')==old, blobs.get('src/sources/shared/dvs.py')
          blobs['src/sources/shared/dvs.py']=new
          notes=data.setdefault('post_freeze_validated_repairs',[])
          notes.append({
            'date':'2026-10-04',
            'scope':'DVS identity and detail-status repair',
            'evidence':'Live DVS audit found distinct DVS-hosted 2026 PDFs sharing source_job_id=2026 and collapsing in durable state. DVS-hosted PDF identity now derives from filename; HTTP 404/410 detail links are classified UNAVAILABLE rather than FETCH_FAILED. Mainz SPA and scanned-PDF limitations remain explicit and were not falsely promoted to resolved.',
            'state_repair':'Authoritative polluted source_id:dvs:2026 entry removed with guarded R2 CAS migration and immutable pre-migration backup; 17 current DVS rows replayed to 17 unique state identities.',
            'state_engine_freeze':'STATE_FREEZE_V1.0.0.json refreshed separately for exact shared DVS board URL non-identity alias correction.',
          })
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify V1 release freeze
        run: python scripts/verify_v1_freeze.py
      - name: Focused DVS regressions
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud.txt pytest
          pytest -q tests/test_dvs_state_identity.py tests/test_phase1_stage4_13_ecss_dvs_coverage.py tests/test_stage5_shared_sources.py -k 'dvs or shared_board'
      - name: Commit freeze refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_FREEZE_V1.1.0.json
          git diff --cached --check
          git commit -m "Refresh V1 freeze for validated DVS repair"
          git push origin HEAD:main
