name: Baseline Runtime Certification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud.txt

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Runtime import sanity
        run: >-
          python -c "import src.runtime.production_shards, src.runtime.production,
          src.runtime.production_sources, src.runtime.board_inventory, src.runtime.coverage_mapping, src.runtime.structural_completeness, src.runtime.gap_register, src.runtime.recall_design, src.runtime.reference_set, src.runtime.observability, src.runtime.failure_classification, src.runtime.anomaly_detection, src.runtime.recovery;
          print('runtime imports OK')"

      - name: Production runtime tests
        run: >-
          python -m unittest -v
          tests.test_v1_production
          tests.test_phase1_stage5_2_stall_diagnostics
          tests.test_phase1_stage5_3_failure_classification
          tests.test_phase1_stage5_4_artifact_durability
          tests.test_phase1_stage5_5_runtime_anomaly_detection
          tests.test_phase1_stage5_6_observability_certification
          tests.test_stage6_1_current_board_inventory
          tests.test_stage6_2_coverage_mapping
          tests.test_stage6_3_structural_completeness
          tests.test_stage6_4_evidence_gap_register
          tests.test_stage6_5_board_completeness_certification
          tests.test_stage7_1_recall_measurement_design
          tests.test_stage7_2_reference_set_construction
          tests.test_stage7_2_reference_capture

      - name: Stage 5 observability certification
        run: python scripts/verify_stage5_observability.py

      - name: Stage 6.1 current board inventory
        run: python scripts/verify_stage6_1_board_inventory.py

      - name: Stage 6.2 coverage mapping
        run: python scripts/verify_stage6_2_coverage_mapping.py

      - name: Stage 6.3 structural completeness
        run: python scripts/verify_stage6_3_structural_completeness.py

      - name: Stage 6.4 evidence gap register
        run: python scripts/verify_stage6_4_gap_register.py

      - name: Stage 6.5 board completeness certification
        run: python scripts/verify_stage6_board_completeness.py

      - name: Stage 7.1 recall measurement design
        run: python scripts/verify_stage7_1_recall_design.py

      - name: Stage 7.2 reference set construction
        run: python scripts/verify_stage7_2_reference_set.py

      - name: Verify frozen stages
        run: |
          python scripts/verify_stage7_freeze.py
          python scripts/verify_stage8_freeze.py
          python scripts/verify_stage9_freeze.py
          python scripts/verify_stage10_freeze.py
          python scripts/verify_v1_freeze.py

      - name: Public readiness scan
        run: python scripts/check_public_readiness.py --history
