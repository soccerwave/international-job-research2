name: Diagnose EURAXESS Live Contract

on:
  push:
    branches:
      - diagnostic/euraxess-live-contract

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect all EURAXESS country facets semantically
        shell: bash
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from src.sources.shared import euraxess

          s=euraxess.make_session(retries=0)
          base=euraxess._get(s,euraxess.SEARCH_URL,pace_seconds=0.5)
          facets=euraxess.discover_country_facets(base.text)
          offer=euraxess.discover_offer_type_facet(base.text)
          endpoint=euraxess._filter_endpoint(base.text,base.url)

          def result_count(html):
              text=BeautifulSoup(html or '', 'html.parser').get_text(' ',strip=True)
              m=re.search(r'Search results\s*\(([0-9,]+)\)',text,re.I)
              return m.group(1) if m else None

          def selected(html):
              return sorted(euraxess._selected_option_values(html,'job_country[]'))

          for code in euraxess.TARGET_CODES:
              facet=euraxess._facet_for_code(facets,code)
              r=euraxess._get(s,endpoint,params=euraxess._filter_params(facet,offer),pace_seconds=1.75)
              rows=euraxess.parse_listing(r.text,r.url)
              print('COUNTRY',code,'FACET',facet,'STATUS',r.status_code,'COUNT',result_count(r.text),'SELECTED',selected(r.text),'NEXT',euraxess.next_listing_url(r.text,r.url))
              for item in rows[:3]:
                  print('ITEM',code,item['id'],'TITLE',item['title'][:80],'CONTEXT',item['context'][:350])
          PY
