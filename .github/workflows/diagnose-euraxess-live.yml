name: Diagnose EURAXESS Live Contract

on:
  push:
    branches:
      - diagnostic/euraxess-live-contract

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run EURAXESS regression tests
        run: python -m unittest tests.test_phase1_stage4_1_euraxess -v
      - name: Run focused live EURAXESS smoke
        shell: bash
        run: |
          python - <<'PY'
          from src.sources.shared import euraxess
          from src.sources.shared.pagination import capture_coverage

          with capture_coverage() as cov:
              rows=euraxess.collect(
                  country_codes=('NL','DE'),
                  pages_per_country=2,
                  max_jobs=None,
                  enrich_detail=False,
                  pace_seconds=0.5,
              )
          counts={c:sum(1 for r in rows if (r.get('raw_extra') or {}).get('requested_country_code')==c) for c in ('NL','DE')}
          ids={c:[r['source']['source_job_id'] for r in rows if (r.get('raw_extra') or {}).get('requested_country_code')==c][:5] for c in ('NL','DE')}
          transports={c:sorted({(r.get('raw_extra') or {}).get('filter_transport') for r in rows if (r.get('raw_extra') or {}).get('requested_country_code')==c}) for c in ('NL','DE')}
          print('LIVE_ROWS',len(rows))
          print('LIVE_COUNTS',counts)
          print('LIVE_IDS',ids)
          print('LIVE_TRANSPORTS',transports)
          print('LIVE_COVERAGE',cov)
          assert counts['NL'] > 0 and counts['DE'] > 0
          assert ids['NL'] != ids['DE']
          assert not any(e.get('stop_reason') in {'filter_validation_failed','identical_country_result_set'} for e in cov)
          PY
