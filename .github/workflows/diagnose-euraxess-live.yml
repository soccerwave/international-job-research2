name: Diagnose EURAXESS Global Cards

on:
  push:
    branches:
      - diagnostic/euraxess-live-contract

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect global result card markup
        shell: bash
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from src.sources.shared import euraxess

          s=euraxess.make_session(retries=0)
          r=s.get(euraxess.SEARCH_URL,timeout=(10,45),allow_redirects=True)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          seen=set()
          for a in soup.find_all('a',href=True):
              m=euraxess.JOB_RE.search(a.get('href') or '')
              if not m or m.group(1) in seen:
                  continue
              seen.add(m.group(1))
              print('=== JOB',m.group(1),'TITLE',euraxess.clean(a.get_text(' ',strip=True))[:120])
              node=a
              for level in range(6):
                  node=node.parent
                  if node is None: break
                  print('LEVEL',level+1,'TAG',node.name,'CLASS',node.get('class'),'TEXT',euraxess.clean(node.get_text(' ',strip=True))[:800])
                  if level<=3:
                      print('HTML',str(node)[:3000].replace('\n',' '))
              if len(seen)>=3:
                  break
          PY
