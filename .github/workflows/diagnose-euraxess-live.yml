name: Diagnose EURAXESS Live Contract

on:
  push:
    branches:
      - diagnostic/euraxess-live-contract

permissions:
  contents: read

jobs:
  country:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        code: [NL, DE, IE, GB, BE, FR, AT, IT, PT, CZ, PL, LU]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test one EURAXESS country on an isolated runner
        shell: bash
        env:
          CODE: ${{ matrix.code }}
        run: |
          python - <<'PY'
          import os,re
          from bs4 import BeautifulSoup
          from src.sources.shared import euraxess
          code=os.environ['CODE']
          s=euraxess.make_session(retries=0)
          base=euraxess._get(s,euraxess.SEARCH_URL,pace_seconds=0.5)
          facets=euraxess.discover_country_facets(base.text)
          offer=euraxess.discover_offer_type_facet(base.text)
          endpoint=euraxess._filter_endpoint(base.text,base.url)
          facet=euraxess._facet_for_code(facets,code)
          r=euraxess._get(s,endpoint,params=euraxess._filter_params(facet,offer),pace_seconds=0.5)
          text=BeautifulSoup(r.text,'html.parser').get_text(' ',strip=True)
          m=re.search(r'Search results\s*\(([0-9,]+)\)',text,re.I)
          rows=euraxess.parse_listing(r.text,r.url)
          print('CODE',code,'FACET',facet,'STATUS',r.status_code,'URL',r.url)
          print('COUNT',m.group(1) if m else None)
          print('SELECTED',sorted(euraxess._selected_option_values(r.text,'job_country[]')))
          print('NEXT',euraxess.next_listing_url(r.text,r.url))
          print('IDS',[x['id'] for x in rows[:5]])
          euraxess._assert_active_filter_response(r,facet,offer)
          assert rows
          PY
