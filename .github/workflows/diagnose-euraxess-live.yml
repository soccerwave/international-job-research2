name: Diagnose EURAXESS Live Contract

on:
  push:
    branches:
      - diagnostic/euraxess-live-contract

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect live EURAXESS pagination contract
        shell: bash
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from src.sources.shared.pagination import next_listing_url

          SEARCH='https://euraxess.ec.europa.eu/jobs/search'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; EURAXESS-contract-diagnostic/1.1)'})

          def ids(html):
              return list(dict.fromkeys(re.findall(r'/jobs/(\d+)(?:[/?#]|$)', html or '')))[:20]

          def result_count(html):
              text=BeautifulSoup(html or '', 'html.parser').get_text(' ', strip=True)
              m=re.search(r'Search results\s*\(([0-9,]+)\)', text, re.I)
              return m.group(1) if m else None

          def candidates(html, base):
              soup=BeautifulSoup(html or '', 'html.parser')
              out=[]
              for a in soup.find_all('a', href=True):
                  text=' '.join(a.get_text(' ',strip=True).split())
                  aria=str(a.get('aria-label') or '')
                  title=str(a.get('title') or '')
                  rel=' '.join(a.get('rel') or [])
                  label=' '.join([text,aria,title]).strip().lower()
                  if 'next' in rel.lower() or re.search(r'\b(next|more jobs|suivant|suivante|volgende|weiter|nächste)\b|^[›»>]$', label):
                      out.append({'text':text,'aria':aria,'title':title,'rel':rel,'href':str(a['href']),'url':urljoin(base,str(a['href']))})
              return out

          base=s.get(SEARCH,timeout=45)
          soup=BeautifulSoup(base.text,'html.parser')
          sel=soup.select_one('select[name="job_country[]"]')
          form=sel.find_parent('form')
          action=urljoin(base.url,form.get('action') or SEARCH)
          offer=form.select_one('select[name="offer_type[]"]')
          offer_value=next(o.get('value') for o in offer.find_all('option') if o.get('value') and ('job' in o.get_text(' ',strip=True).lower() or 'job' in o.get('value').lower()))
          cmap={o.get_text(' ',strip=True):o.get('value') for o in sel.find_all('option') if o.get_text(' ',strip=True) in {'Netherlands','Germany'}}

          print('FORM_METHOD',form.get('method'),'ACTION',action,'OFFER',offer_value,'COUNTRIES',cmap)
          for label in ('Netherlands','Germany'):
              cv=cmap[label]
              params=[('f[0]',f'job_country:{cv}'),('f[1]',f'offer_type:{offer_value}')]
              r=s.get(action,params=params,timeout=45,allow_redirects=True)
              print('---',label,'---')
              print('URL',r.url)
              print('COUNT',result_count(r.text))
              print('IDS',ids(r.text)[:10])
              print('CURRENT_HELPER_NEXT',next_listing_url(r.text,r.url))
              print('NEXT_CANDIDATES',candidates(r.text,r.url))
              n=next_listing_url(r.text,r.url)
              if n:
                  nr=s.get(n,timeout=45,allow_redirects=True)
                  print('HELPER_NEXT_FETCH_URL',nr.url)
                  print('HELPER_NEXT_COUNT',result_count(nr.text))
                  print('HELPER_NEXT_IDS',ids(nr.text)[:10])
          PY
