name: Diagnose EURAXESS Live Contract

on:
  push:
    branches:
      - diagnostic/euraxess-live-contract

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect EURAXESS HTML for alternate search endpoints
        shell: bash
        run: |
          python - <<'PY'
          import re,html as htmllib
          from src.sources.shared import euraxess
          s=euraxess.make_session(retries=0)
          r=s.get(euraxess.SEARCH_URL,timeout=(10,45))
          r.raise_for_status()
          html=r.text
          patterns=[
              r'https?://[^"\'<> ]+',
              r'/(?:api|views|search-api|search_api)[^"\'<> ]*',
              r'data-[a-z0-9_-]+="[^"]*"',
          ]
          seen=set()
          for pat in patterns:
              for m in re.finditer(pat,html,re.I):
                  v=htmllib.unescape(m.group(0))
                  if any(k in v.lower() for k in ('api','view','search','facet','ajax')):
                      if v not in seen:
                          seen.add(v)
                          print('MATCH',v[:1200])
          for token in ('oe-list-pages-facets-form','job_country','offer_type','search_api','views/ajax','drupalSettings'):
              i=html.lower().find(token.lower())
              if i>=0:
                  print('SNIPPET',token,html[max(0,i-1500):i+2500].replace('\n',' ')[:4000])
          PY
