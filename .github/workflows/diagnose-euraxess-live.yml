name: Diagnose EURAXESS Live Contract

on:
  push:
    branches:
      - diagnostic/euraxess-live-contract

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run EURAXESS regression tests
        run: python -m unittest tests.test_phase1_stage4_1_euraxess -v
      - name: Run 12-country live EURAXESS first-page smoke
        shell: bash
        run: |
          python - <<'PY'
          from src.sources.shared import euraxess
          from src.sources.shared.pagination import capture_coverage

          codes=euraxess.TARGET_CODES
          with capture_coverage() as cov:
              rows=euraxess.collect(
                  country_codes=codes,
                  pages_per_country=1,
                  max_jobs=None,
                  enrich_detail=False,
                  pace_seconds=1.25,
              )
          counts={c:sum(1 for r in rows if (r.get('raw_extra') or {}).get('requested_country_code')==c) for c in codes}
          ids={c:[r['source']['source_job_id'] for r in rows if (r.get('raw_extra') or {}).get('requested_country_code')==c][:3] for c in codes}
          transports={c:sorted({(r.get('raw_extra') or {}).get('filter_transport') for r in rows if (r.get('raw_extra') or {}).get('requested_country_code')==c}) for c in codes}
          bad=[e for e in cov if e.get('stop_reason') in {'filter_validation_failed','identical_country_result_set'}]
          print('LIVE_TOTAL',len(rows))
          print('LIVE_COUNTS',counts)
          print('LIVE_IDS',ids)
          print('LIVE_TRANSPORTS',transports)
          print('LIVE_BAD_EVENTS',bad)
          print('LIVE_COVERAGE',cov)
          assert all(counts[c] > 0 for c in codes), counts
          assert not bad, bad
          nonempty=[tuple(ids[c]) for c in codes if ids[c]]
          assert len(set(nonempty)) == len(nonempty), ids
          PY
