name: Diagnose EURAXESS Live Contract

on:
  push:
    branches:
      - diagnostic/euraxess-live-contract

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect EURAXESS detail country markup
        shell: bash
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from src.sources.shared import euraxess

          s=euraxess.make_session(retries=0)
          base=euraxess._get(s,euraxess.SEARCH_URL,pace_seconds=0.2)
          facets=euraxess.discover_country_facets(base.text)
          offer=euraxess.discover_offer_type_facet(base.text)
          endpoint=euraxess._filter_endpoint(base.text,base.url)
          facet=euraxess._facet_for_code(facets,'NL')
          r=euraxess._get(s,endpoint,params=euraxess._filter_params(facet,offer),pace_seconds=0.2)
          rows=euraxess.parse_listing(r.text,r.url)
          print('LISTING',[(x['id'],x['title']) for x in rows[:3]])
          u=rows[0]['url']
          d=euraxess._get(s,u,pace_seconds=0.2)
          print('DETAIL_URL',d.url)
          soup=BeautifulSoup(d.text,'html.parser')
          hits=[]
          for node in soup.find_all(string=True):
              t=' '.join(str(node).split())
              if t.lower()=='country':
                  p=node.parent
                  hits.append({
                      'tag':p.name,
                      'class':p.get('class'),
                      'parent_tag':p.parent.name if p.parent else None,
                      'parent_class':p.parent.get('class') if p.parent else None,
                      'parent_text':' '.join(p.parent.get_text(' ',strip=True).split())[:500] if p.parent else None,
                      'parent_html':str(p.parent)[:1800] if p.parent else None,
                  })
          print('COUNTRY_HITS',hits)
          print('PARSED_META',euraxess.parse_detail_metadata(d.text))
          PY
