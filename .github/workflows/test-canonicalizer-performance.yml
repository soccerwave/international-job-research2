name: Canonicalizer Performance Equivalence

on:
  pull_request:
    paths:
      - 'src/runtime/canonicalizer_fast.py'
      - 'scripts/compare_canonicalizers.py'
      - '.github/workflows/test-canonicalizer-performance.yml'

permissions:
  contents: read
  actions: read

jobs:
  compare-sep12-real-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_ACTIONS_RUN_ID: '34671847466'
      TARGET_PRODUCTION_RUN_ID: 'prod-34671847466-1'
      ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud.txt
      - name: Require encrypted artifact key
        run: test -n "${ARTIFACT_ENCRYPTION_KEY:-}"
      - name: Download Sep 12 encrypted shard artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.TARGET_ACTIONS_RUN_ID }}
          pattern: production-shard-*
          path: downloaded-shards
      - name: Decrypt shard bundles in ephemeral runner workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/$TARGET_PRODUCTION_RUN_ID"
          while IFS= read -r -d '' encrypted; do
            bash scripts/secure_artifact.sh unpack "$encrypted" "artifacts/$TARGET_PRODUCTION_RUN_ID"
          done < <(find downloaded-shards -type f -name '*.tar.gz.enc' -print0)
          count="$(find "artifacts/$TARGET_PRODUCTION_RUN_ID/shards" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "decrypted_shard_count=$count"
          test "$count" -eq 17
      - name: Compare legacy and cached canonicalizers
        run: |
          python scripts/compare_canonicalizers.py \
            --run-id "$TARGET_PRODUCTION_RUN_ID" \
            --artifact-root artifacts \
            --output-root compare-output
      - name: Confirm ephemeral-only comparison
        run: |
          test ! -e state/current/state.json
          echo "authoritative_state_mutation=false"
