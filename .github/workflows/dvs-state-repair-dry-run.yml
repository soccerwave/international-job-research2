name: DVS State Repair Dry Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dvs-state-repair-dry-run.yml"

permissions:
  contents: read

concurrency:
  group: international-academic-production
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-cloud.txt pytest
      - name: Validate DVS parser identity regression
        run: pytest -q tests/test_phase1_stage4_13_ecss_dvs_coverage.py tests/test_stage5_shared_sources.py -k dvs
      - name: Diagnose authoritative DVS state aliases
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from src.sources.shared import dvs
          from src.state.engine import _aliases, state_sha256
          from src.state.r2_store import R2StateStore

          loaded=R2StateStore.from_env(prefix='').load_current(allow_missing=False)
          state=loaded.state
          rows=dvs.collect(max_jobs=None,enrich_detail=False)

          alias_index=defaultdict(set)
          for sid,e in state['jobs'].items():
              for alias in e.get('aliases') or []:
                  alias_index[alias].add(sid)

          current=[]
          conflicts=[]
          for r in rows:
              aliases=[a for _,a in _aliases(r)]
              matches=sorted({sid for a in aliases for sid in alias_index.get(a,set())})
              item={
                  'source_job_id':r['source']['source_job_id'],
                  'title':r['position']['title_raw'],
                  'url':r['source']['detail_url'],
                  'aliases':aliases,
                  'matching_state_ids':matches,
              }
              current.append(item)
              if len(matches)>1:
                  conflicts.append(item)

          suspicious=[]
          for sid,e in state['jobs'].items():
              aliases=e.get('aliases') or []
              if any(a.startswith('source_id:dvs:2026') for a in aliases) or any(
                  'berufungsportal.uni-mainz.de/ausschreibungen/' in a for a in aliases
              ):
                  suspicious.append({
                      'state_id':sid,
                      'aliases':aliases,
                      'times_seen':e.get('times_seen'),
                      'first_seen_at':e.get('first_seen_at'),
                      'last_seen_at':e.get('last_seen_at'),
                      'last_snapshot':e.get('last_snapshot'),
                  })

          ids=[r['source']['source_job_id'] for r in rows]
          print('DVS_STATE_ALIAS_DIAGNOSTIC',json.dumps({
              'generation':state['generation'],
              'sha':state_sha256(state),
              'etag':loaded.etag,
              'state_jobs':len(state['jobs']),
              'current_rows':len(rows),
              'unique_current_source_ids':len(set(ids)),
              'duplicate_current_source_ids':sorted({x for x in ids if ids.count(x)>1}),
              'conflicts':conflicts,
              'suspicious_state_entries':suspicious,
              'current':current,
          },ensure_ascii=False,indent=2))
          assert len(ids)==len(set(ids)), ids
          assert '2026' not in ids
          PY
