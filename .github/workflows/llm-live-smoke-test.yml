name: LLM Live Smoke Test

on:
  push:
    branches:
      - llm-live-smoke-test-v3

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud.txt
      - name: Require smoke credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "Missing OPENAI_API_KEY" >&2; exit 2; }
          test -n "${R2_ACCOUNT_ID:-}" || { echo "Missing R2_ACCOUNT_ID" >&2; exit 2; }
          test -n "${R2_ACCESS_KEY_ID:-}" || { echo "Missing R2_ACCESS_KEY_ID" >&2; exit 2; }
          test -n "${R2_SECRET_ACCESS_KEY:-}" || { echo "Missing R2_SECRET_ACCESS_KEY" >&2; exit 2; }
          test -n "${R2_BUCKET:-}" || { echo "Missing R2_BUCKET" >&2; exit 2; }
      - name: Run live GPT-6 Luna smoke test
        run: python scripts/run_llm_live_smoke_test.py
