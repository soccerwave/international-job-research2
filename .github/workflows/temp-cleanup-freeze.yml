name: Temporary cleanup freeze manifest

on:
  push:
    branches: [cleanup-github-actions]
    paths:
      - '.github/workflows/temp-cleanup-freeze.yml'

permissions:
  contents: write

jobs:
  patch-freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-github-actions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove retired workflow paths from release freeze
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('RELEASE_FREEZE_V1.1.0.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          protected = data['protected_git_blobs']
          protected.pop('.github/workflows/stage7-reference-capture.yml', None)
          protected.pop('.github/workflows/test-stage7-2-reference-storage.yml', None)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit manifest update if changed
        run: |
          if git diff --quiet -- RELEASE_FREEZE_V1.1.0.json; then
            echo 'No manifest change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_FREEZE_V1.1.0.json
          git commit -m 'Update release freeze after workflow cleanup'
          git push origin HEAD:cleanup-github-actions
