name: Weekly R2 Luna and Collector Audit Export

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First UTC publication date (YYYY-MM-DD)
        required: true
        default: '2026-10-26'
        type: string
      end_date:
        description: Last UTC publication date (YYYY-MM-DD)
        required: true
        default: '2026-11-01'
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight report dependencies
        run: python -m pip install --disable-pip-version-check boto3 XlsxWriter
      - name: Export published weekly reports from R2
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python scripts/export_weekly_r2_audit.py --start "$START_DATE" --end "$END_DATE" --out weekly-audit-export.zip
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-r2-luna-collector-audit
          path: weekly-audit-export.zip
          retention-days: 14
          if-no-files-found: error
