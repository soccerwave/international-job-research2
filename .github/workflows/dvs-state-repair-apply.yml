name: DVS State Repair Apply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dvs-state-repair-apply.yml"

permissions:
  contents: read

concurrency:
  group: international-academic-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-cloud.txt pytest
      - name: Focused DVS regressions before state mutation
        run: pytest -q tests/test_dvs_state_identity.py tests/test_phase1_stage4_13_ecss_dvs_coverage.py tests/test_stage5_shared_sources.py -k 'dvs or shared_board'
      - name: Guard, backup, repair, publish, verify
        run: |
          python - <<'PY'
          import copy, hashlib, json
          from src.sources.shared import dvs
          from src.state.engine import apply_state, WRITER_ROLE, state_bytes, state_sha256, validate_state
          from src.state.r2_store import R2StateStore

          EXPECTED_SHA='82cae3c94b8ec2d2e670c29c257e82a6597f5c79a581451704c928f0df48ba4f'
          EXPECTED_GENERATION=39
          POLLUTED_ID='job_77f5a4e7642c73e46f7b'
          RUN_ID='dvs-identity-repair-2026-10-04'

          store=R2StateStore.from_env(prefix='')
          loaded=store.load_current(allow_missing=False)
          state=loaded.state
          before_sha=state_sha256(state)
          assert before_sha==EXPECTED_SHA, (before_sha,EXPECTED_SHA)
          assert state['generation']==EXPECTED_GENERATION, state['generation']
          assert loaded.etag, 'missing current ETag'
          matches=[sid for sid,e in state['jobs'].items() if 'source_id:dvs:2026' in (e.get('aliases') or [])]
          assert matches==[POLLUTED_ID], matches
          polluted=state['jobs'][POLLUTED_ID]
          assert polluted.get('times_seen')==39, polluted.get('times_seen')
          assert len([a for a in polluted.get('aliases',[]) if a.startswith('url:')])>=6

          # Immutable PRE-migration backup, because R2StateStore.publish backs up the new state.
          before_payload=state_bytes(state)
          before_key=store.key(f'state/migrations/dvs/2026-10-04-before-{before_sha[:12]}.json')
          before_meta={
              'sha256': hashlib.sha256(before_payload).hexdigest(),
              'state-version': str(state['state_version']),
              'generation': str(state['generation']),
              'migration': 'dvs-identity-repair',
          }
          store._put(key=before_key,payload=before_payload,headers={'If-None-Match':'*'},metadata=before_meta)

          repaired=copy.deepcopy(state)
          del repaired['jobs'][POLLUTED_ID]
          repaired['generation']=EXPECTED_GENERATION+1
          validate_state(repaired)
          expected_after_sha=state_sha256(repaired)

          # Re-read immediately before CAS publish to close the race window.
          current=store.load_current(allow_missing=False)
          assert current.etag==loaded.etag, (current.etag,loaded.etag)
          assert state_sha256(current.state)==EXPECTED_SHA

          result=store.publish(repaired,expected_etag=loaded.etag,run_id=RUN_ID)
          verified=store.load_current(allow_missing=False)
          after=verified.state
          assert after['generation']==EXPECTED_GENERATION+1
          assert state_sha256(after)==expected_after_sha
          assert POLLUTED_ID not in after['jobs']
          assert not [sid for sid,e in after['jobs'].items() if 'source_id:dvs:2026' in (e.get('aliases') or [])]
          assert len(after['jobs'])==len(state['jobs'])-1

          # Dry replay current DVS rows on the repaired authoritative state. No second publish.
          rows=dvs.collect(max_jobs=None,enrich_detail=False)
          ids=[r['source']['source_job_id'] for r in rows]
          assert len(rows)==17 and len(ids)==len(set(ids)) and '2026' not in ids
          replay,summary=apply_state(rows,after,observed_at='2026-10-04T20:50:00+00:00',run_id='dvs-post-repair-replay',writer_role=WRITER_ROLE)
          state_ids=[r['raw_extra']['state']['state_id'] for r in rows]
          assert len(state_ids)==17 and len(set(state_ids))==17, state_ids

          print('DVS_STATE_REPAIR_OK',json.dumps({
              'before_generation':EXPECTED_GENERATION,
              'after_generation':after['generation'],
              'before_sha':before_sha,
              'after_sha':expected_after_sha,
              'before_etag':loaded.etag,
              'after_etag':verified.etag,
              'before_backup_key':before_key,
              'publish_backup_key':result['backup_key'],
              'polluted_removed':POLLUTED_ID,
              'jobs_before':len(state['jobs']),
              'jobs_after':len(after['jobs']),
              'replay_rows':len(rows),
              'replay_unique_source_ids':len(set(ids)),
              'replay_unique_state_ids':len(set(state_ids)),
              'replay_summary':summary,
          },ensure_ascii=False,sort_keys=True))
          PY
