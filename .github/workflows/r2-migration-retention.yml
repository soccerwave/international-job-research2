name: R2 Migration Snapshot Retention

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Actually delete migration snapshots older than retention window
        required: true
        default: false
        type: boolean
      max_age_days:
        description: Delete migration snapshots older than this age
        required: true
        default: '14'
        type: string
  schedule:
    - cron: '23 9 * * 0'
  push:
    branches: [main]
    paths:
      - 'src/state/r2_migration_retention.py'
      - 'scripts/prune_r2_migration_snapshots.py'
      - 'tests/test_r2_migration_retention.py'
      - '.github/workflows/r2-migration-retention.yml'

permissions:
  contents: read

concurrency:
  group: r2-migration-snapshot-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud.txt
      - name: Run migration retention regression tests
        run: python -m unittest tests.test_r2_migration_retention -v
      - name: Preview or apply migration snapshot retention
        shell: bash
        env:
          APPLY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
          MAX_AGE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_age_days || '14' }}
        run: |
          set -euo pipefail
          args=(--max-age-days "$MAX_AGE_DAYS")
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          fi
          python scripts/prune_r2_migration_snapshots.py "${args[@]}"
