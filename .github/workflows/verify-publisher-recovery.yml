name: Temporary Verify Publisher Recovery

on:
  push:
    branches:
      - ops/dispatch-publisher-35559436411
    paths:
      - '.github/workflows/verify-publisher-recovery.yml'

permissions:
  actions: read
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find and wait for latest manual publisher run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list             --repo "${GITHUB_REPOSITORY}"             --workflow publish-control-plane-report.yml             --event workflow_dispatch             --limit 1             --json databaseId             --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status

          result="$(gh run view "$run_id"             --repo "${GITHUB_REPOSITORY}"             --json databaseId,status,conclusion,url             --jq '[.databaseId,.status,.conclusion,.url] | @tsv')"
          payload="$(printf '%s\n' "$result" | base64 -w0)"
          gh api             --method PUT             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/contents/ops/publisher-recovery-result.txt"             -f message='Record publisher recovery result'             -f content="$payload"             -f branch='ops/dispatch-publisher-35559436411'
