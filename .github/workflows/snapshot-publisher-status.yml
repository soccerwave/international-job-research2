name: Temporary Snapshot Publisher Status

on:
  push:
    branches:
      - ops/dispatch-publisher-35559436411
    paths:
      - '.github/workflows/snapshot-publisher-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot latest manual publisher run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(gh run list             --repo "${GITHUB_REPOSITORY}"             --workflow publish-control-plane-report.yml             --event workflow_dispatch             --limit 1             --json databaseId,status,conclusion,url,createdAt,headSha             --jq '.[0] | [.databaseId,.status,.conclusion,.url,.createdAt,.headSha] | @tsv')"
          payload="$(printf '%s\n' "$result" | base64 -w0)"
          gh api             --method PUT             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/contents/ops/publisher-status-snapshot.txt"             -f message='Record publisher status snapshot'             -f content="$payload"             -f branch='ops/dispatch-publisher-35559436411'
