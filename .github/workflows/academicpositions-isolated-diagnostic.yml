name: AcademicPositions Isolated Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/sources/shared/academicpositions.py'
      - '.github/workflows/academicpositions-isolated-diagnostic.yml'
      - 'tests/test_academicpositions_diagnostic.py'

permissions:
  contents: read

jobs:
  academicpositions-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
      DIAGNOSTIC_RUN_ID: diag-academicpositions-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud.txt

      - name: Require encrypted artifact transport
        shell: bash
        run: test -n "${ARTIFACT_ENCRYPTION_KEY:-}" || { echo 'Missing ARTIFACT_ENCRYPTION_KEY secret' >&2; exit 2; }

      - name: Probe AcademicPositions access variants
        shell: bash
        run: |
          mkdir -p "diagnostic-artifacts/$DIAGNOSTIC_RUN_ID"
          python - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path
          from src.sources.shared.common import make_session
          from src.sources.shared.academicpositions import parse_listing, is_blocked

          target = "https://academicpositions.com/jobs/country/germany"
          variants = []

          def capture(name, session, url=target, **kwargs):
              try:
                  r = session.get(url, timeout=(10, 45), allow_redirects=True, **kwargs)
                  variants.append({
                      "name": name,
                      "requested_url": url,
                      "status": r.status_code,
                      "response_url": r.url,
                      "server": r.headers.get("server"),
                      "via": r.headers.get("via"),
                      "cf_ray": r.headers.get("cf-ray"),
                      "content_type": r.headers.get("content-type"),
                      "content_length": len(r.content),
                      "blocked_marker": is_blocked(r.text),
                      "listing_count": len(parse_listing(r.text, r.url)) if r.status_code == 200 else 0,
                      "title_prefix": (r.text[:180].replace("\n", " ") if r.text else ""),
                  })
              except Exception as exc:
                  variants.append({"name": name, "error": f"{type(exc).__name__}: {exc}"})

          capture("repo_make_session", make_session(retries=0))

          browser_headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-GB,en;q=0.9",
              "Cache-Control": "no-cache",
          }
          browser = requests.Session()
          browser.headers.update(browser_headers)
          capture("browser_headers_direct", browser)

          warmed = requests.Session()
          warmed.headers.update(browser_headers)
          try:
              home = warmed.get("https://academicpositions.com/", timeout=(10,45), allow_redirects=True)
              variants.append({
                  "name": "browser_home_warmup",
                  "status": home.status_code,
                  "response_url": home.url,
                  "cookie_count": len(warmed.cookies),
                  "content_length": len(home.content),
              })
          except Exception as exc:
              variants.append({"name": "browser_home_warmup", "error": f"{type(exc).__name__}: {exc}"})
          capture("browser_headers_after_home", warmed)

          for prefix in ("en", "de"):
              s = requests.Session()
              s.headers.update(browser_headers)
              capture(f"browser_language_path_{prefix}", s, f"https://academicpositions.com/{prefix}/jobs/country/germany")

          root = Path("diagnostic-artifacts") / os.environ["DIAGNOSTIC_RUN_ID"]
          out = root / "access-probe.json"
          out.write_text(json.dumps(variants, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(variants, ensure_ascii=False, indent=2))
          PY

      - name: Run current collector in isolation
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.sources.shared import academicpositions
          from src.sources.shared.pagination import capture_coverage

          root = Path("diagnostic-artifacts") / os.environ["DIAGNOSTIC_RUN_ID"]
          with capture_coverage() as audit:
              records = academicpositions.collect(
                  country_codes=("DE", "NL", "BE"),
                  max_pages_per_country=None,
                  max_jobs=None,
                  enrich_detail=False,
              )
          summary = {
              "record_count": len(records),
              "coverage": audit,
              "sample_ids": [(r.get("source") or {}).get("source_job_id") for r in records[:10]],
          }
          (root / "collector-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Encrypt diagnostic artifact
        shell: bash
        run: |
          base="diagnostic-artifacts/$DIAGNOSTIC_RUN_ID"
          bash scripts/secure_artifact.sh pack             "$base"             "academicpositions-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz.enc"             "access-probe.json"             "collector-summary.json"

      - name: Upload encrypted diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: academicpositions-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: academicpositions-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz.enc
          retention-days: 2
