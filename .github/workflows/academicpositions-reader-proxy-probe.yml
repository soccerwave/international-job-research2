name: AcademicPositions Reader Proxy Probe

on:
  push:
    branches:
      - diag/academicpositions-reader-proxy
    paths:
      - '.github/workflows/academicpositions-reader-proxy-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe public reader transports
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error

          target = "https://academicpositions.com/jobs/country/germany"
          candidates = {
              "jina_https": "https://r.jina.ai/https://academicpositions.com/jobs/country/germany",
              "jina_http": "https://r.jina.ai/http://academicpositions.com/jobs/country/germany",
          }
          results = []
          for name, url in candidates.items():
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; academic-job-monitor-probe/1.0)",
                  "Accept": "text/plain,text/markdown,*/*",
              })
              item = {"name": name, "url": url}
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      text = r.read().decode("utf-8", "replace")
                      low = text.lower()
                      item.update({
                          "status": r.status,
                          "response_url": r.geturl(),
                          "content_type": r.headers.get("content-type"),
                          "length": len(text),
                          "challenge_marker": any(x in low for x in ("just a moment", "checking your browser", "cf-chl-")),
                          "jobs_heading": bool(re.search(r"\b\d+\s+jobs?\s+in\s+germany\b", text, re.I)),
                          "academicpositions_links": len(set(re.findall(r"https?://academicpositions\.com/[^\s)\]>]+", text, re.I))),
                          "ad_links": len(set(re.findall(r"https?://academicpositions\.com/(?:[a-z]{2}/)?ad/[^\s)\]>]+/\d+", text, re.I))),
                          "prefix": text[:500],
                      })
              except urllib.error.HTTPError as e:
                  text = e.read().decode("utf-8", "replace")
                  item.update({"status": e.code, "length": len(text), "prefix": text[:500]})
              except Exception as exc:
                  item["error"] = f"{type(exc).__name__}: {exc}"
              results.append(item)
          print(json.dumps(results, ensure_ascii=False, indent=2))

          reader_base = "https://r.jina.ai/http://academicpositions.com"
          pages = []
          seen = set()
          detail_url = None
          for page in range(1, 6):
              suffix = "/jobs/country/germany" if page == 1 else f"/jobs/country/germany?page={page}"
              url = reader_base + suffix
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; academic-job-monitor-probe/1.0)",
                  "Accept": "text/plain,text/markdown,*/*",
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      text = r.read().decode("utf-8", "replace")
              except Exception as exc:
                  pages.append({"page": page, "error": f"{type(exc).__name__}: {exc}"})
                  break
              links = sorted(set(re.findall(
                  r"https?://academicpositions\.com/(?:[a-z]{2}/)?ad/[^\s)\]>]+/\d+",
                  text, re.I
              )))
              ids = []
              for link in links:
                  clean_link = link.split("?", 1)[0].split("#", 1)[0].rstrip("/")
                  tail = clean_link.rsplit("/", 1)[-1]
                  if tail.isdigit():
                      ids.append(tail)
              new_ids = [x for x in ids if x not in seen]
              seen.update(ids)
              if detail_url is None and links:
                  detail_url = links[0]
              pages.append({
                  "page": page,
                  "status": r.status,
                  "length": len(text),
                  "count": len(ids),
                  "new_count": len(new_ids),
                  "ids": ids[:10],
                  "has_next_hint": f"page={page+1}" in text,
                  "challenge_marker": any(x in text.lower() for x in ("just a moment", "checking your browser", "cf-chl-")),
              })
              if not new_ids:
                  break

          detail = None
          if detail_url:
              target = detail_url.replace("https://", "http://", 1)
              detail_reader = "https://r.jina.ai/" + target
              req = urllib.request.Request(detail_reader, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; academic-job-monitor-probe/1.0)",
                  "Accept": "text/plain,text/markdown,*/*",
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      text = r.read().decode("utf-8", "replace")
                      detail = {
                          "source_url": detail_url,
                          "status": r.status,
                          "length": len(text),
                          "challenge_marker": any(x in text.lower() for x in ("just a moment", "checking your browser", "cf-chl-")),
                          "has_description_markers": any(x in text.lower() for x in ("job description", "about the position", "about the job", "requirements", "qualifications")),
                          "prefix": text[:800],
                      }
              except Exception as exc:
                  detail = {"source_url": detail_url, "error": f"{type(exc).__name__}: {exc}"}

          page3_engines = []
          page3_url = "https://r.jina.ai/http://academicpositions.com/jobs/country/germany?page=3"
          for engine in (None, "direct", "cf-browser-rendering"):
              headers = {
                  "User-Agent": "Mozilla/5.0 (compatible; academic-job-monitor-probe/1.0)",
                  "Accept": "text/plain,text/markdown,*/*",
              }
              if engine:
                  headers["X-Engine"] = engine
              req = urllib.request.Request(page3_url, headers=headers)
              item = {"engine": engine or "default"}
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      text = r.read().decode("utf-8", "replace")
                      links = sorted(set(re.findall(
                          r"https?://academicpositions\.com/(?:[a-z]{2}/)?ad/[^\s)\]>]+/\d+",
                          text, re.I
                      )))
                      item.update({
                          "status": r.status,
                          "length": len(text),
                          "challenge_marker": any(x in text.lower() for x in ("just a moment", "checking your browser", "cf-chl-")),
                          "count": len(links),
                          "links": links[:5],
                      })
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  item.update({"status": e.code, "length": len(body), "prefix": body[:300]})
              except Exception as exc:
                  item["error"] = f"{type(exc).__name__}: {exc}"
              page3_engines.append(item)

          print("PAGINATION_AND_DETAIL")
          print(json.dumps({
              "pages": pages,
              "unique_ids": len(seen),
              "detail": detail,
              "page3_engines": page3_engines,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Stress-test reader coverage and detail sampling
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, urllib.request, urllib.error

          countries = {
              "NL":"netherlands","DE":"germany","IE":"ireland","GB":"united-kingdom",
              "BE":"belgium","FR":"france","AT":"austria","IT":"italy",
              "PT":"portugal","CZ":"czechia","PL":"poland","LU":"luxembourg",
          }
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; academic-job-monitor-stress-probe/1.0)",
              "Accept": "text/plain,text/markdown,*/*",
          }
          link_re = re.compile(r"https?://academicpositions\.com/(?:[a-z]{2}/)?ad/[^\s)\]>]+/\d+", re.I)
          total_re = re.compile(r"Title:\s*(\d+)\s+jobs?\s+in\b", re.I)

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.status, r.read().decode("utf-8", "replace"), None
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace"), None
              except Exception as exc:
                  return None, "", f"{type(exc).__name__}: {exc}"

          summary = {}
          detail_candidates = []
          for code, slug in countries.items():
              seen = {}
              advertised = None
              pages = []
              for page in range(1, 11):
                  suffix = f"/jobs/country/{slug}" if page == 1 else f"/jobs/country/{slug}?page={page}"
                  url = "https://r.jina.ai/http://academicpositions.com" + suffix
                  status, text, error = get(url)
                  if page == 1:
                      m = total_re.search(text)
                      advertised = int(m.group(1)) if m else None
                  links = sorted(set(link_re.findall(text))) if text else []
                  new_links = []
                  for link in links:
                      tail = link.split("?",1)[0].split("#",1)[0].rstrip("/").rsplit("/",1)[-1]
                      if tail.isdigit() and tail not in seen:
                          seen[tail] = link
                          new_links.append(link)
                  challenge = any(x in text.lower() for x in ("just a moment", "checking your browser", "cf-chl-")) if text else False
                  pages.append({
                      "page": page, "status": status, "count": len(links),
                      "new_count": len(new_links), "challenge": challenge, "error": error,
                  })
                  if status != 200 or error:
                      break
                  if not new_links:
                      break
                  time.sleep(3.2)
              summary[code] = {
                  "advertised_total": advertised,
                  "unique_ids": len(seen),
                  "complete_against_advertised": advertised is not None and len(seen) == advertised,
                  "pages": pages,
              }
              detail_candidates.extend(list(seen.values())[:2])
              time.sleep(3.2)

          details = []
          for link in detail_candidates[:20]:
              target = link.replace("https://", "http://", 1)
              status, text, error = get("https://r.jina.ai/" + target)
              details.append({
                  "source_url": link,
                  "status": status,
                  "length": len(text),
                  "challenge": any(x in text.lower() for x in ("just a moment", "checking your browser", "cf-chl-")) if text else False,
                  "has_description_markers": any(x in text.lower() for x in ("job description", "about the position", "about the job", "requirements", "qualifications")) if text else False,
                  "error": error,
              })
              time.sleep(3.2)

          result = {
              "countries": summary,
              "country_count": len(summary),
              "countries_complete_against_advertised": sum(1 for x in summary.values() if x["complete_against_advertised"]),
              "total_unique_ids": sum(x["unique_ids"] for x in summary.values()),
              "detail_sample_count": len(details),
              "detail_200": sum(1 for x in details if x["status"] == 200),
              "detail_challenges": sum(1 for x in details if x["challenge"]),
              "detail_errors": sum(1 for x in details if x["error"]),
              "details": details,
          }
          print("STRESS_RESULT")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
