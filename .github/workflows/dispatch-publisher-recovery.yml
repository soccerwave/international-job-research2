name: Temporary Dispatch Publisher Recovery

on:
  push:
    branches:
      - ops/dispatch-publisher-35559436411
    paths:
      - '.github/workflows/dispatch-publisher-recovery.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publisher recovery for existing production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-control-plane-report.yml             --repo "${GITHUB_REPOSITORY}"             --ref main             -f source_run_id=35559436411
