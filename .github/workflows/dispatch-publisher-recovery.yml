name: Temporary Dispatch Publisher Recovery

on:
  push:
    branches:
      - ops/dispatch-publisher-35559436411
    paths:
      - '.github/workflows/dispatch-publisher-recovery.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publisher recovery for existing production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-control-plane-report.yml             --repo "${GITHUB_REPOSITORY}"             --ref main             -f source_run_id=35559436411

          payload="$(printf 'publisher recovery dispatched for source_run_id=35559436411\n' | base64 -w0)"
          gh api             --method PUT             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/contents/ops/publisher-dispatch-confirmation.txt"             -f message='Record publisher recovery dispatch'             -f content="$payload"             -f branch='ops/dispatch-publisher-35559436411'
