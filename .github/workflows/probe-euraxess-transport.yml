name: Temporary EURAXESS Transport Probe

on:
  pull_request:
    paths:
      - '.github/workflows/probe-euraxess-transport.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Probe page transport variants
        run: |
          python - <<'PY'
          import json
          import time
          from src.sources.shared import euraxess

          def ids(response):
              return [r["id"] for r in euraxess.parse_listing(response.text, response.url)]

          base_session = euraxess.make_session(retries=0)
          r0 = base_session.get(euraxess.SEARCH_URL, timeout=(10,45), allow_redirects=True)
          r0.raise_for_status()
          page0_ids = ids(r0)
          variants = []

          def capture(name, response):
              current_ids = ids(response)
              variants.append({
                  "name": name,
                  "status": response.status_code,
                  "response_url": response.url,
                  "ids": current_ids,
                  "same_as_page0": current_ids == page0_ids,
                  "next_url": euraxess.next_listing_url(response.text, response.url),
                  "cache_control": response.headers.get("Cache-Control"),
                  "age": response.headers.get("Age"),
                  "via": response.headers.get("Via"),
                  "x_cache": response.headers.get("X-Cache"),
              })

          time.sleep(2)
          capture("same_session_plain", base_session.get(
              euraxess.SEARCH_URL + "?page=1",
              timeout=(10,45), allow_redirects=True,
          ))

          time.sleep(2)
          capture("same_session_no_cache_headers", base_session.get(
              euraxess.SEARCH_URL + "?page=1",
              headers={"Cache-Control":"no-cache", "Pragma":"no-cache"},
              timeout=(10,45), allow_redirects=True,
          ))

          time.sleep(2)
          capture("same_session_cache_buster", base_session.get(
              euraxess.SEARCH_URL + "?page=1&diagnostic_cb=${{ github.run_id }}",
              timeout=(10,45), allow_redirects=True,
          ))

          fresh = euraxess.make_session(retries=0)
          time.sleep(2)
          capture("fresh_session_plain", fresh.get(
              euraxess.SEARCH_URL + "?page=1",
              timeout=(10,45), allow_redirects=True,
          ))

          time.sleep(2)
          capture("params_page", fresh.get(
              euraxess.SEARCH_URL,
              params={"page":"1"},
              timeout=(10,45), allow_redirects=True,
          ))

          print(json.dumps({
              "page0_ids": page0_ids,
              "page0_next": euraxess.next_listing_url(r0.text, r0.url),
              "variants": variants,
          }, indent=2))
          PY
