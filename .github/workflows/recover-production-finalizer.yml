name: Recover Production Finalizer

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Cancelled production run whose completed shard artifacts should be reused
        required: true
        default: '34671847466'
        type: string
      send_telegram:
        description: Publish and deliver the recovered clean Excel report
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: international-academic-production
  cancel-in-progress: false

jobs:
  recover-finalizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      PRODUCTION_RUN_ID: prod-${{ inputs.source_run_id }}-1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      TELEGRAM_SEND_REPORT_ALWAYS: 'true'
      ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud.txt
      - name: Require encrypted artifact transport
        shell: bash
        run: test -n "${ARTIFACT_ENCRYPTION_KEY:-}" || { echo 'Missing ARTIFACT_ENCRYPTION_KEY secret' >&2; exit 2; }
      - name: Verify frozen accepted baselines before recovery mutation
        run: |
          python scripts/verify_stage7_freeze.py
          python scripts/verify_stage8_freeze.py
          python scripts/verify_stage9_freeze.py
          python scripts/verify_stage10_freeze.py
      - name: Validate cancelled source run and immutable shard set
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from src.runtime.production_shards import PRODUCTION_SHARD_IDS

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = str(os.environ['SOURCE_RUN_ID']).strip()
          token = os.environ['GH_TOKEN']
          if not run_id.isdigit():
              raise SystemExit('source_run_id must be a numeric GitHub Actions run id')
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'production-finalizer-recovery',
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          run = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
          if str(run.get('path') or '') != '.github/workflows/production.yml':
              raise SystemExit(f"Source run is not production.yml: {run.get('path')}")
          if run.get('conclusion') != 'cancelled':
              raise SystemExit(f"Recovery is restricted to a cancelled production run, got: {run.get('conclusion')}")

          artifacts = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100')
          names = {str(item.get('name') or '') for item in artifacts.get('artifacts') or [] if not item.get('expired')}
          expected = {f'production-shard-{shard}' for shard in PRODUCTION_SHARD_IDS}
          missing = sorted(expected - names)
          if missing:
              raise SystemExit('Missing or expired shard artifacts: ' + ', '.join(missing))

          jobs = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100')
          finalizers = [job for job in jobs.get('jobs') or [] if job.get('name') == 'production-finalizer']
          if len(finalizers) != 1:
              raise SystemExit(f'Expected exactly one production-finalizer job, found {len(finalizers)}')
          finalizer = finalizers[0]
          if finalizer.get('conclusion') != 'cancelled':
              raise SystemExit(f"Source finalizer was not cancelled: {finalizer.get('conclusion')}")
          observed_at = str(finalizer.get('started_at') or '').strip()
          if not observed_at:
              raise SystemExit('Source finalizer has no started_at timestamp')

          values = {
              'source_run_id': run_id,
              'source_attempt': int(run.get('run_attempt') or 1),
              'source_head_sha': run.get('head_sha') or '',
              'observed_at': observed_at,
              'shard_artifacts': len(expected),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
          print(json.dumps(values, indent=2))
          PY
      - name: Download encrypted shard artifacts from cancelled production run
        uses: actions/download-artifact@v4
        with:
          pattern: production-shard-*
          path: downloaded-shards
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.source_run_id }}
      - name: Decrypt immutable production shard bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/$PRODUCTION_RUN_ID"
          found=0
          while IFS= read -r -d '' encrypted; do
            found=$((found + 1))
            bash scripts/secure_artifact.sh unpack "$encrypted" "artifacts/$PRODUCTION_RUN_ID"
          done < <(find downloaded-shards -type f -name '*.tar.gz.enc' -print0)
          if [ "$found" -ne 17 ]; then
            echo "Expected 17 encrypted shard bundles, found $found" >&2
            exit 2
          fi
      - name: Run authoritative production finalizer from recovered shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/$PRODUCTION_RUN_ID"
          timeout 35m python scripts/run_production_finalizer.py \
            --run-id "$PRODUCTION_RUN_ID" \
            --observed-at '${{ steps.source.outputs.observed_at }}' \
            | tee "artifacts/$PRODUCTION_RUN_ID/production_console.json"
      - name: Encrypt recovered production evidence for Actions retention
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          base="artifacts/$PRODUCTION_RUN_ID"
          [ -d "$base" ] || exit 0
          paths=()
          for path in finalizer preprod production production_console.json; do
            [ -e "$base/$path" ] && paths+=("$path")
          done
          [ "${#paths[@]}" -gt 0 ] || exit 0
          bash scripts/secure_artifact.sh pack \
            "$base" \
            "secure-artifacts/production-recovery-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz.enc" \
            "${paths[@]}"
      - name: Upload encrypted recovered production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: secure-artifacts/production-recovery-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz.enc
          retention-days: 2
          if-no-files-found: warn
      - name: Validate recovered reporting inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "artifacts/$PRODUCTION_RUN_ID/production/report_summary.json"
          test -s "artifacts/$PRODUCTION_RUN_ID/production/canonical_records.json"
          test -s "artifacts/$PRODUCTION_RUN_ID/production/academic_job_report.xlsx"
      - name: Build calibrated clean recovered Excel and summary
        run: |
          python -m scripts.build_user_excel \
            --records "artifacts/$PRODUCTION_RUN_ID/production/canonical_records.json" \
            --base-summary "artifacts/$PRODUCTION_RUN_ID/production/report_summary.json" \
            --summary-out clean-report/report_summary.json \
            --output clean-report/international_academic_job_report.xlsx
      - name: Publish recovered clean report and latest pointer to international R2
        run: |
          python scripts/publish_control_plane_report.py \
            --summary clean-report/report_summary.json \
            --report clean-report/international_academic_job_report.xlsx \
            --audit-report "artifacts/$PRODUCTION_RUN_ID/production/academic_job_report.xlsx" \
            --github-run-id '${{ github.run_id }}' \
            --github-run-attempt '${{ github.run_attempt }}' \
            --commit '${{ github.sha }}' \
            --manifest-out control-plane-publish-evidence.json
      - name: Deliver recovered clean report to Telegram
        if: ${{ inputs.send_telegram }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.reporting.telegram import send_report

          summary = json.loads(Path('clean-report/report_summary.json').read_text(encoding='utf-8'))
          report = Path('clean-report/international_academic_job_report.xlsx')
          if not report.is_file() or report.stat().st_size == 0:
              raise RuntimeError('Recovered clean report is missing; refusing delivery')
          send_report(summary, report)
          print(json.dumps({'ok': True, 'delivered': True, 'recovery_source_run_id': '${{ steps.source.outputs.source_run_id }}'}))
          PY
