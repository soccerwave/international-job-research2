name: DVS Isolated Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dvs-isolated-diagnostic.yml"
      - "src/sources/shared/dvs.py"
      - "tests/test_stage5_shared_sources.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-cloud.txt pytest
      - name: Inspect Mainz published jobs chunk and backend config
        run: |
          python - <<'PY'
          import re, requests
          origin='https://berufungsportal.uni-mainz.de/'
          h=requests.get(origin+'ausschreibungen/69?lang=de',timeout=30).text
          main_name=re.search(r'<script[^>]+src=["\'](main-[^"\']+\.js)',h,re.I).group(1)
          main=requests.get(origin+main_name,timeout=30).text
          names=set(re.findall(r'chunk-[A-Z0-9]+\.js',main))
          names.add('chunk-52NV42CX.js')
          print('CHUNKS',sorted(names))
          for name in sorted(names):
              r=requests.get(origin+name,timeout=30)
              if r.status_code!=200 or len(r.text)<300:
                  continue
              text=r.text
              if not any(k in text.lower() for k in ('job_listing','ausschreib','published','backend')):
                  continue
              print('\n### CHUNK',name,'bytes',len(text))
              for needle in ['job_listing','published','ausschreib','getPublished','backend','/jobs','job_listings']:
                  start=0; shown=0
                  while shown<10:
                      i=text.lower().find(needle.lower(),start)
                      if i<0: break
                      print('---',needle,'---')
                      print(text[max(0,i-450):min(len(text),i+900)])
                      start=i+len(needle); shown+=1
          # Search main for likely backend host/config values near configuration helpers.
          for needle in ['websiteTenants:', 'baseWithTenant:', 'base:', 'exceptionalTenant']:
              print('\nMAINCONFIG',needle)
              start=0; shown=0
              while shown<12:
                  i=main.find(needle,start)
                  if i<0: break
                  print(main[max(0,i-700):min(len(main),i+1400)])
                  start=i+len(needle); shown+=1
          PY
      - name: Run DVS identity tests
        run: pytest -q tests/test_phase1_stage4_13_ecss_dvs_coverage.py tests/test_stage5_shared_sources.py -k dvs
