name: DVS Isolated Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dvs-isolated-diagnostic.yml"
      - "src/sources/shared/dvs.py"
      - "tests/test_stage5_shared_sources.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-cloud.txt pytest
      - name: Inspect Mainz frontend API configuration
        run: |
          python - <<'PY'
          import re, requests
          origin='https://berufungsportal.uni-mainz.de/'
          h=requests.get(origin+'ausschreibungen/69?lang=de',timeout=30).text
          main=re.search(r'<script[^>]+src=["\'](main-[^"\']+\.js)',h,re.I).group(1)
          js=requests.get(origin+main,timeout=30).text
          print('MAIN_JS',main,'bytes',len(js))
          needles=['websiteTenants','baseWithTenant','backend/dashboard','ausschreibungen','environment','apiUrl','baseUrl','backend:']
          for needle in needles:
              print('\nNEEDLE',needle)
              start=0; shown=0
              while shown<12:
                  i=js.find(needle,start)
                  if i<0: break
                  print(js[max(0,i-350):min(len(js),i+650)])
                  start=i+len(needle); shown+=1
          strings=[]
          for m in re.findall(r'["\']([^"\']{2,220})["\']',js):
              low=m.lower()
              if any(k in low for k in ('backend','ausschreib','api','tenant','dashboard')) and m not in strings:
                  strings.append(m)
          print('\nINTERESTING_STRINGS')
          for x in strings[:250]: print(repr(x))
          PY
      - name: Audit authoritative DVS collision summary
        run: |
          python - <<'PY'
          import json
          from src.state.r2_store import R2StateStore
          state=R2StateStore.from_env(prefix='').load_current(allow_missing=False).state
          matches=[]
          for sid,e in state['jobs'].items():
              aliases=e.get('aliases') or []
              if 'source_id:dvs:2026' in aliases:
                  matches.append({'state_id':sid,'aliases':aliases,'times_seen':e.get('times_seen'),'first_seen_at':e.get('first_seen_at'),'last_seen_at':e.get('last_seen_at'),'last_snapshot':e.get('last_snapshot')})
          print('DVS_2026_STATE',json.dumps({'generation':state['generation'],'matches':matches},ensure_ascii=False,indent=2))
          PY
      - name: Run DVS tests
        run: pytest -q tests/test_phase1_stage4_13_ecss_dvs_coverage.py tests/test_stage5_shared_sources.py -k dvs
