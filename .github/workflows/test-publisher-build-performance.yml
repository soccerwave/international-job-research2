name: Publisher Build Performance Check

on:
  pull_request:
    paths:
      - 'scripts/build_user_excel.py'
      - 'src/reporting/user_excel.py'
      - '.github/workflows/publish-control-plane-report.yml'
      - '.github/workflows/test-publisher-build-performance.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  replay-latest-production-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reporting dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud.txt
      - name: Resolve latest successful production run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/production.yml/runs?status=success&per_page=20',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'publisher-performance-check',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          runs = [item for item in data.get('workflow_runs', []) if item.get('conclusion') == 'success']
          if not runs:
              raise SystemExit('No successful production run available')
          run = runs[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"run_id={run['id']}\n")
              handle.write(f"run_attempt={int(run.get('run_attempt') or 1)}\n")
          print(json.dumps({'run_id': run['id'], 'run_attempt': int(run.get('run_attempt') or 1)}, indent=2))
          PY
      - name: Download encrypted production evidence
        uses: actions/download-artifact@v4
        with:
          name: production-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: encrypted-production
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Decrypt production evidence
        shell: bash
        run: |
          set -euo pipefail
          encrypted="$(find encrypted-production -type f -name '*.tar.gz.enc' -print -quit)"
          test -n "$encrypted"
          bash scripts/secure_artifact.sh unpack "$encrypted" downloaded-production
      - name: Build clean report within performance budget
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          timeout 600 python -m scripts.build_user_excel \
            --records downloaded-production/production/canonical_records.json \
            --base-summary downloaded-production/production/report_summary.json \
            --summary-out clean-report/report_summary.json \
            --output clean-report/international_academic_job_report.xlsx
          end="$(date +%s)"
          elapsed="$((end-start))"
          echo "publisher_build_elapsed_seconds=$elapsed"
          test -s clean-report/international_academic_job_report.xlsx
          test -s clean-report/report_summary.json
