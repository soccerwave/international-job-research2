name: Public Readiness Security Gate

on:
  pull_request:
    paths:
      - '.github/workflows/production.yml'
      - '.github/workflows/publish-control-plane-report.yml'
      - '.github/workflows/recover-production-state.yml'
      - '.github/workflows/test-public-readiness.yml'
      - 'scripts/secure_artifact.sh'
      - 'scripts/check_public_readiness.py'
      - 'docs/security/PUBLIC_READINESS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan current tree and git history without printing secret values
        run: python scripts/check_public_readiness.py --history
      - name: Verify encrypted artifact helper round trip
        shell: bash
        env:
          ARTIFACT_ENCRYPTION_KEY: public-readiness-test-key-not-a-production-secret
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-ready/in /tmp/public-ready/out
          printf 'sensitive-test-payload\n' >/tmp/public-ready/in/payload.txt
          bash scripts/secure_artifact.sh pack /tmp/public-ready/in /tmp/public-ready/payload.tar.gz.enc payload.txt
          if grep -aF 'sensitive-test-payload' /tmp/public-ready/payload.tar.gz.enc; then
            echo 'Encrypted artifact contains plaintext payload' >&2
            exit 1
          fi
          bash scripts/secure_artifact.sh unpack /tmp/public-ready/payload.tar.gz.enc /tmp/public-ready/out
          cmp /tmp/public-ready/in/payload.txt /tmp/public-ready/out/payload.txt
      - name: Enforce Actions artifact privacy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ARTIFACT_ENCRYPTION_KEY' .github/workflows/production.yml
          grep -q '\.tar\.gz\.enc' .github/workflows/production.yml
          grep -q 'ARTIFACT_ENCRYPTION_KEY' .github/workflows/recover-production-state.yml
          grep -q '\.tar\.gz\.enc' .github/workflows/recover-production-state.yml
          if grep -A12 'uses: actions/upload-artifact@v4' .github/workflows/production.yml | grep -E 'path: .*artifacts/.*/(shards|production|preprod|finalizer)'; then
            echo 'Raw production data path is uploaded to GitHub Actions' >&2
            exit 1
          fi
          if grep -A12 'uses: actions/upload-artifact@v4' .github/workflows/recover-production-state.yml | grep -E 'path: .*recovery_result\.json'; then
            echo 'Raw recovery evidence is uploaded to GitHub Actions' >&2
            exit 1
          fi
          if grep -q 'actions/upload-artifact@' .github/workflows/publish-control-plane-report.yml; then
            echo 'Control-plane publisher must not retain Excel/report artifacts on GitHub' >&2
            exit 1
          fi
