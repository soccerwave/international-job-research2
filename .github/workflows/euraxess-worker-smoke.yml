name: EURAXESS Worker isolated smoke (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EURAXESS_WORKER_URL: ${{ vars.EURAXESS_WORKER_URL }}
      EURAXESS_WORKER_TOKEN: ${{ secrets.EURAXESS_WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Bounded Germany EURAXESS test, no state writes
        run: python scripts/smoke_euraxess_worker.py
