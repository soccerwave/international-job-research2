name: AcademicPositions Cloudflare Origin Probe

on:
  push:
    branches:
      - diag/academicpositions-cloudflare-origin
    paths:
      - '.github/workflows/academicpositions-cloudflare-origin-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: academicpositions-origin-probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 2; }

      - name: Build temporary Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ap-worker
          cat > ap-worker/package.json <<'JSON'
          {
            "private": true,
            "devDependencies": {
              "wrangler": "4.41.0"
            }
          }
          JSON
          cat > ap-worker/wrangler.toml <<EOF
          name = "$WORKER_NAME"
          main = "src/index.js"
          compatibility_date = "2026-09-27"
          workers_dev = true
          EOF
          mkdir -p ap-worker/src
          cat > ap-worker/src/index.js <<'JS'
          export default {
            async fetch(request) {
              const url = new URL(request.url);
              if (url.pathname !== "/probe") {
                return new Response("not found", { status: 404 });
              }
              const target = "https://academicpositions.com/jobs/country/germany";
              try {
                const res = await fetch(target, {
                  headers: {
                    "User-Agent": "Mozilla/5.0 (compatible; academic-job-monitor/1.0)",
                    "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                    "Accept-Language": "en-GB,en;q=0.9"
                  },
                  redirect: "follow"
                });
                const body = await res.text();
                const low = body.toLowerCase();
                const adMatches = [...body.matchAll(/\/ad\/[^"'<> ]+\/\d+/gi)].map((m) => m[0]);
                const result = {
                  ok: res.ok,
                  status: res.status,
                  response_url: res.url,
                  server: res.headers.get("server"),
                  content_type: res.headers.get("content-type"),
                  body_length: body.length,
                  challenge_marker: ["just a moment", "checking your browser", "cf-chl-"].some((x) => low.includes(x)),
                  has_jobs_heading: /\b\d+\s+jobs?\s+in\s+germany\b/i.test(body),
                  ad_link_count: new Set(adMatches).size
                };
                return Response.json(result);
              } catch (error) {
                return Response.json({ ok: false, error: String(error?.message || error) }, { status: 502 });
              }
            }
          };
          JS

      - name: Install Wrangler
        working-directory: ap-worker
        run: npm install --no-audit --no-fund

      - name: Deploy temporary Worker
        working-directory: ap-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log

      - name: Resolve workers.dev URL
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          data=$(curl -fsS --max-time 20             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          subdomain=$(printf '%s' "$data" | python -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("subdomain") or "")')
          test -n "$subdomain" || { echo "Could not resolve workers.dev subdomain" >&2; exit 3; }
          url="https://$WORKER_NAME.$subdomain.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Worker URL resolved."

      - name: Probe AcademicPositions from Cloudflare edge
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 30 "$WORKER_URL/probe" -o probe.json; then
              cat probe.json
              echo
              python - <<'PY'
          import json
          data=json.load(open("probe.json", encoding="utf-8"))
          required=["status","challenge_marker","body_length","ad_link_count"]
          missing=[k for k in required if k not in data]
          if missing:
              raise SystemExit(f"Missing probe fields: {missing}")
          print("PROBE_STATUS", data["status"])
          print("PROBE_CHALLENGE", data["challenge_marker"])
          print("PROBE_JOB_LINKS", data["ad_link_count"])
          PY
              exit 0
            fi
            sleep 2
          done
          echo "Worker probe endpoint did not become reachable" >&2
          exit 4

      - name: Delete temporary Worker
        if: always()
        working-directory: ap-worker
        shell: bash
        run: |
          set +e
          npx wrangler delete --name "$WORKER_NAME" --force
