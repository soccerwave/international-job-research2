name: Temporary E0.2.2 Occupational Calibration Regression

on:
  pull_request:
    paths:
      - 'src/evaluation/calibrated_e02.py'
      - 'src/evaluation/calibrated_e021.py'
      - 'tests/test_evaluator_e021_calibration.py'
      - '.github/workflows/test-e022-occupational-calibration.yml'

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused evaluator regression tests
        run: python -m unittest -v tests.test_evaluator_e021_calibration
