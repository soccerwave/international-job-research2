name: Diagnose University Vacancies Ireland (isolated)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/sources/core/university_vacancies.py
      - .github/workflows/diagnose-university-vacancies-ie.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-university-vacancies-ie.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Probe API and HTML independently (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser

          BASE = 'https://universityvacancies.com'
          targets = [
              ('home', BASE + '/'),
              ('search', BASE + '/search'),
              ('api_plain', BASE + '/api/job-posts/public?page=1&limit=3'),
              ('api_browser_headers', BASE + '/api/job-posts/public?page=1&limit=3'),
          ]

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      d = dict(attrs)
                      if d.get('href'):
                          self.links.append(d['href'])

          results = {}
          for label, url in targets:
              headers = {'User-Agent': 'InternationalJobResearch-Diagnostic/1.0',
                         'Accept': 'application/json' if 'api_' in label else 'text/html'}
              if label == 'api_browser_headers':
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36',
                      'Accept': 'application/json, text/plain, */*',
                      'Referer': BASE + '/search',
                      'Origin': BASE,
                  }
              t0 = time.monotonic()
              row = {'url_path': urllib.parse.urlsplit(url).path}
              try:
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      res = urllib.request.urlopen(req, timeout=25)
                  except urllib.error.HTTPError as exc:
                      res = exc
                  with res:
                      row['http_status'] = res.status
                      row['final_path'] = urllib.parse.urlsplit(res.url).path
                      row['content_type'] = res.headers.get('Content-Type', '').split(';')[0]
                      row['server'] = (res.headers.get('Server') or '')[:70]
                      raw = res.read(500000)
                      row['sample_bytes'] = len(raw)
                      text = raw.decode('utf-8', errors='replace')
                      if row['content_type'] == 'application/json':
                          try:
                              payload = json.loads(text)
                              data = payload.get('data') if isinstance(payload, dict) else None
                              row['json_keys'] = list(payload.keys())[:12] if isinstance(payload, dict) else []
                              row['job_posts_count'] = len(data.get('jobPosts', [])) if isinstance(data, dict) and isinstance(data.get('jobPosts'), list) else None
                              row['pagination'] = (data.get('pagination') if isinstance(data, dict) else None)
                          except (ValueError, TypeError):
                              row['json_parse_error'] = True
                      elif 'html' in row['content_type']:
                          parser = LinkParser()
                          parser.feed(text)
                          row['link_count'] = len(parser.links)
                          row['job_like_links'] = len([x for x in parser.links if re.search(r'job|vacanc|position', x, re.I)])
                          row['html_title'] = (re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S).group(1).strip()[:90] if re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S) else None)
                          row['script_next_data'] = '__NEXT_DATA__' in text
                          row['script_nuxt'] = '__NUXT__' in text
              except Exception as exc:
                  row['exception'] = f'{type(exc).__name__}: {str(exc)[:240]}'
              row['elapsed_seconds'] = round(time.monotonic()-t0, 2)
              results[label] = row
              print(json.dumps({label: row}, ensure_ascii=False), flush=True)
          print('DIAGNOSTIC_SUMMARY=' + json.dumps(results, ensure_ascii=False, sort_keys=True), flush=True)
          PY
      - name: Compare production-size API request and real collector (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import requests
          from src.sources.core import university_vacancies
          from src.sources.shared.common import make_session

          url = university_vacancies.PUBLIC_API_URL
          for label, session in [('requests_default', requests.Session()), ('production_session', make_session())]:
              for limit in (3, 100):
                  started = time.monotonic()
                  try:
                      response = session.get(url, params={'page': 1, 'limit': limit}, timeout=(10, 45), allow_redirects=True)
                      result = {'status': response.status_code, 'content_type': response.headers.get('Content-Type', '').split(';')[0]}
                      if response.ok:
                          payload = response.json()
                          data = payload.get('data') or {}
                          result['rows'] = len(data.get('jobPosts') or [])
                          result['pagination'] = data.get('pagination')
                  except Exception as exc:
                      result = {'exception': type(exc).__name__ + ': ' + str(exc)[:180]}
                  result['elapsed_seconds'] = round(time.monotonic() - started, 2)
                  print('REQUEST_PROBE=' + json.dumps({'client': label, 'limit': limit, **result}), flush=True)

          started = time.monotonic()
          try:
              records = university_vacancies.collect(max_jobs=None, enrich_detail=False)
              statuses = {}
              for row in records:
                  status = row.get('detail_status', 'UNKNOWN')
                  statuses[status] = statuses.get(status, 0) + 1
              print('COLLECTOR_PROBE=' + json.dumps({
                  'ok': True, 'records': len(records), 'detail_status_counts': statuses,
                  'elapsed_seconds': round(time.monotonic()-started, 2),
              }), flush=True)
          except Exception as exc:
              print('COLLECTOR_PROBE=' + json.dumps({
                  'ok': False, 'exception': type(exc).__name__ + ': ' + str(exc)[:300],
                  'elapsed_seconds': round(time.monotonic()-started, 2),
              }), flush=True)
          PY
      - name: Validate complete urllib pagination and detail access (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from src.sources.core.university_vacancies import parse_search_payload

          base = 'https://universityvacancies.com/api/job-posts/public'
          def get_json(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'InternationalJobResearch-Diagnostic/1.0',
                  'Accept': 'application/json'
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'Unexpected HTTP {response.status}')
                  return json.load(response)

          started = time.monotonic()
          seen = set()
          total = None
          pages = 0
          missing_titles = 0
          statuses = {}
          examples = []
          try:
              while True:
                  pages += 1
                  if pages > 30:
                      raise RuntimeError('Safety stop: pagination exceeded 30 pages')
                  query = urllib.parse.urlencode({'page': pages, 'limit': 100})
                  payload = get_json(base + '?' + query)
                  data = payload.get('data') or {}
                  pagination = data.get('pagination') or {}
                  if total is None:
                      total = pagination.get('total')
                  rows = parse_search_payload(payload)
                  raw_rows = data.get('jobPosts') or []
                  missing_titles += len(raw_rows) - len(rows)
                  duplicate_ids = [row['id'] for row in rows if row['id'] in seen]
                  if duplicate_ids:
                      raise RuntimeError('Duplicate job IDs between pages: ' + str(len(duplicate_ids)))
                  seen.update(row['id'] for row in rows)
                  examples.extend(row['id'] for row in rows[:2] if len(examples) < 3)
                  print('URLLIB_PAGE=' + json.dumps({'page': pages, 'raw_rows': len(raw_rows), 'valid_rows': len(rows), 'reported_total': pagination.get('total'), 'has_next': pagination.get('hasNext')}), flush=True)
                  if not pagination.get('hasNext'):
                      break
              for ident in examples[:3]:
                  try:
                      detail = get_json(base + '/' + urllib.parse.quote(str(ident), safe=''))
                      row = detail.get('data') or {}
                      description = str(row.get('description') or '')
                      statuses[ident] = {'ok': True, 'description_chars': len(description)}
                  except Exception as exc:
                      statuses[ident] = {'ok': False, 'error': type(exc).__name__ + ': ' + str(exc)[:150]}
              output = {'ok': True, 'pages': pages, 'unique_records': len(seen), 'reported_total': total, 'invalid_rows': missing_titles, 'matches_reported_total': len(seen) == total, 'detail_examples': statuses, 'elapsed_seconds': round(time.monotonic()-started, 2)}
          except Exception as exc:
              output = {'ok': False, 'pages_completed': pages-1, 'unique_records': len(seen), 'reported_total': total, 'error': type(exc).__name__ + ': ' + str(exc)[:220], 'elapsed_seconds': round(time.monotonic()-started, 2)}
          print('URLLIB_VALIDATION=' + json.dumps(output, ensure_ascii=False), flush=True)
          if not output['ok'] or not output.get('matches_reported_total'):
              raise SystemExit('urllib validation did not establish complete coverage')
          PY
      - name: Validate Ireland collector with isolated urllib session (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from src.sources.core.university_vacancies import collect
          import urllib.parse
          import urllib.request
          import urllib.error

          class UrllibResponse:
              def __init__(self, status_code, payload):
                  self.status_code = status_code
                  self._payload = payload
              def raise_for_status(self):
                  if self.status_code >= 400:
                      raise RuntimeError(f'HTTP {self.status_code}')
              def json(self):
                  return self._payload

          class UrllibSession:
              def get(self, url, *, params=None, timeout=None, allow_redirects=True):
                  if params:
                      url += '?' + urllib.parse.urlencode(params)
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'InternationalJobResearch-Diagnostic/1.0',
                      'Accept': 'application/json',
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          return UrllibResponse(resp.status, json.load(resp))
                  except urllib.error.HTTPError as exc:
                      return UrllibResponse(exc.code, {})

          # Production remains unchanged. Inject validated HTTP transport in this isolated test.
          records = collect(max_jobs=None, enrich_detail=True, session=UrllibSession())
          ids = [str(r['source']['source_job_id']) for r in records]
          details = {}
          for record in records:
              status = str(record['description']['detail_status'])
              details[status] = details.get(status, 0) + 1
          result = {'records': len(records), 'unique_ids': len(set(ids)), 'details': details}
          print('PATCHED_COLLECTOR_RESULT=' + json.dumps(result), flush=True)
          if not records or len(set(ids)) != len(ids):
              raise SystemExit('Collector returned empty or duplicate records')
          PY
      - name: Validate native Ireland collector urllib transport (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from src.sources.core.university_vacancies import collect
          records = collect(max_jobs=None, enrich_detail=True)
          ids = [str(r['source']['source_job_id']) for r in records]
          details = {}
          for record in records:
              status = record['description']['detail_status']
              details[status] = details.get(status, 0) + 1
          result = {'records': len(records), 'unique_ids': len(set(ids)), 'details': details}
          print('NATIVE_COLLECTOR_RESULT=' + json.dumps(result), flush=True)
          if len(records) < 100 or len(set(ids)) != len(ids) or details.get('FULL', 0) != len(records):
              raise SystemExit('Native Ireland collector coverage or detail validation failed')
          PY
