name: Temporary Focused Replay Verification Final Config

on:
  pull_request:
    paths:
      - '.github/workflows/export-evaluator-source.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused evaluator regressions
        run: python -m unittest -v tests.test_evaluator_e021_calibration
      - uses: actions/upload-artifact@v4
        with:
          name: replay-source-e022-final
          path: |
            src
            config
            scripts/build_user_excel.py
            requirements.txt
            requirements-cloud.txt
          retention-days: 1
