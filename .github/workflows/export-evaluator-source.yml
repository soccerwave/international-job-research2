name: Temporary Export Main Replay Source

on:
  pull_request:
    paths:
      - '.github/workflows/export-evaluator-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-artifact@v4
        with:
          name: replay-source-main
          path: |
            src
            scripts/build_user_excel.py
            requirements.txt
            requirements-cloud.txt
          retention-days: 1
