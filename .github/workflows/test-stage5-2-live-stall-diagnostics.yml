name: Stage 5.2 LinkedIn Stall Diagnostics

on:
  pull_request:
    paths:
      - 'src/runtime/production_shards.py'
      - 'scripts/run_production_shard.py'
      - 'tests/test_phase1_stage5_2_stall_diagnostics.py'
      - '.github/workflows/test-stage5-2-live-stall-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkedin-germany-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PRODUCTION_RUN_ID: stage52-${{ github.run_id }}-${{ github.run_attempt }}
      PRODUCTION_MAX_JOBS_PER_SOURCE: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: oven-sh/setup-bun@v2
      - name: Fetch pinned Mads LinkedIn transport
        run: |
          git clone --filter=blob:none https://github.com/MadsLorentzen/ai-job-search.git .vendor/ai-job-search
          git -C .vendor/ai-job-search checkout fd89eac178dc546d41f6c1a3213de88d96112c6d
          echo "AI_JOB_SEARCH_MADS_REPO=$GITHUB_WORKSPACE/.vendor/ai-job-search" >> "$GITHUB_ENV"
      - name: Run uncapped LinkedIn Germany shard
        id: shard
        continue-on-error: true
        run: python scripts/run_production_shard.py --run-id "$PRODUCTION_RUN_ID" --shard-id linkedin-europe-germany
      - name: Summarize stall diagnostics
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          run_id = os.environ['PRODUCTION_RUN_ID']
          root = Path('artifacts') / run_id / 'diagnostics' / 'linkedin-europe-germany'
          lifecycle = root / 'source_lifecycle.jsonl'
          linkedin = root / 'progress.jsonl'
          if not lifecycle.exists():
              raise SystemExit('missing source_lifecycle.jsonl')
          life = [json.loads(x) for x in lifecycle.read_text(encoding='utf-8').splitlines() if x.strip()]
          print('lifecycle_event_count=', len(life))
          print('lifecycle_events=', [x.get('event') for x in life])
          print('lifecycle_last=', json.dumps(life[-1], ensure_ascii=False))
          waits = [x for x in life if x.get('event') == 'source_waiting']
          print('source_waiting_count=', len(waits))
          if waits:
              print('source_waiting_last_elapsed_seconds=', waits[-1].get('elapsed_seconds'))
          if linkedin.exists():
              events = [json.loads(x) for x in linkedin.read_text(encoding='utf-8').splitlines() if x.strip()]
              print('linkedin_event_count=', len(events))
              print('linkedin_last_events=')
              for event in events[-12:]:
                  safe = {k: v for k, v in event.items() if k not in {'record', 'items'}}
                  print(json.dumps(safe, ensure_ascii=False))
          else:
              print('linkedin_progress_missing=true')
          PY
      - name: Require successful shard completion
        if: always()
        shell: bash
        env:
          SHARD_OUTCOME: ${{ steps.shard.outcome }}
        run: |
          test "$SHARD_OUTCOME" = "success" || { echo "LinkedIn diagnostic shard did not complete successfully" >&2; exit 1; }
