name: Publish International Control Plane Report

on:
  workflow_run:
    workflows: ["International Academic Job Search Production"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Production workflow run ID; defaults to latest successful run
        required: false
        type: string
      recover_oct18_report:
        description: One-time recovery of 18 Oct 2026 report from completed finalizer artifact
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: international-control-plane-report-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_SHADOW_MODEL: gpt-6-luna
      EVENT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      INPUT_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '' }}
      RECOVER_OCT18_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_oct18_report || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reporting dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud.txt
      - name: Require encrypted artifact transport
        shell: bash
        run: test -n "${ARTIFACT_ENCRYPTION_KEY:-}" || { echo 'Missing ARTIFACT_ENCRYPTION_KEY secret' >&2; exit 2; }
      - name: Verify two-sheet report before publishing
        run: python -m unittest -v tests.test_user_excel tests.test_review_more
      - name: Resolve successful production source run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          requested = str(os.environ.get('EVENT_RUN_ID') or os.environ.get('INPUT_SOURCE_RUN_ID') or '').strip()
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'international-control-plane-publisher',
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          if requested:
              run = get(f'https://api.github.com/repos/{repo}/actions/runs/{requested}')
          else:
              data = get(
                  f'https://api.github.com/repos/{repo}/actions/workflows/production.yml/runs'
                  '?status=success&per_page=20'
              )
              runs = [item for item in (data.get('workflow_runs') or []) if item.get('conclusion') == 'success']
              if not runs:
                  raise SystemExit('No successful production workflow run is available to publish')
              run = runs[0]

          recovery = os.environ.get('RECOVER_OCT18_REPORT', '').lower() == 'true'
          if recovery:
              # Explicitly scoped to the single known incident; never weaken automatic publication.
              if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch' or str(run.get('id')) != '39095615068':
                  raise SystemExit('Recovery is permitted only for manually selected production run 39095615068')
              if run.get('status') != 'completed':
                  raise SystemExit('Recovery source run has not completed')
              jobs = get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")
              finalizers = [job for job in (jobs.get('jobs') or []) if job.get('name') == 'production-finalizer']
              if len(finalizers) != 1 or finalizers[0].get('conclusion') != 'success':
                  raise SystemExit('Recovery refused: production-finalizer must have succeeded')
              artifacts = get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100")
              expected = f"production-{run['id']}-{int(run.get('run_attempt') or 1)}"
              if not any(a.get('name') == expected and not a.get('expired') for a in (artifacts.get('artifacts') or [])):
                  raise SystemExit(f'Recovery refused: finalizer evidence artifact {expected} is missing')
          elif run.get('conclusion') == 'failure' and os.environ.get('GITHUB_EVENT_NAME') == 'workflow_run':
              # Only tolerate failed *transport* after successful collection and finalization.
              jobs = get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")
              all_jobs = jobs.get('jobs') or []
              finalizers = [j for j in all_jobs if j.get('name') == 'production-finalizer']
              failed = [j for j in all_jobs if j.get('conclusion') == 'failure']
              if len(finalizers) != 1 or finalizers[0].get('conclusion') != 'success' or not failed:
                  raise SystemExit('Failed production cannot be published: finalizer/failed jobs unsafe')
              for job in failed:
                  if not str(job.get('name') or '').startswith('production-shards ('):
                      raise SystemExit(f"Unexpected failed job: {job.get('name')}")
                  steps = job.get('steps') or []
                  upload = [st for st in steps if st.get('name') == 'Upload encrypted production shard bundle']
                  collected = [st for st in steps if st.get('name') == 'Run independent production shard']
                  packed = [st for st in steps if st.get('name') == 'Encrypt shard bundle for Actions transport']
                  if (len(upload) != 1 or upload[0].get('conclusion') != 'failure'
                          or len(collected) != 1 or collected[0].get('conclusion') != 'success'
                          or len(packed) != 1 or packed[0].get('conclusion') != 'success'
                          or any(st.get('conclusion') == 'failure' and st.get('name') != 'Upload encrypted production shard bundle' for st in steps)):
                      raise SystemExit(f"Failed shard not exclusively artifact transport: {job.get('name')}")
              artifacts = get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100")
              expected = f"production-{run['id']}-{int(run.get('run_attempt') or 1)}"
              if not any(a.get('name') == expected and not a.get('expired') for a in (artifacts.get('artifacts') or [])):
                  raise SystemExit('Finalizer evidence artifact missing; refusing incomplete publication')
              print(f"WARNING: transport-only shard failure; verified finalizer and evidence for {run['id']}")
          elif run.get('conclusion') != 'success':
              raise SystemExit(f"Source run {run.get('id')} is not successful: {run.get('conclusion')}")
          if str(run.get('path') or '') != '.github/workflows/production.yml':
              raise SystemExit(f"Source run {run.get('id')} is not the production workflow: {run.get('path')}")

          values = {
              'run_id': run['id'],
              'run_attempt': int(run.get('run_attempt') or 1),
              'head_sha': run.get('head_sha') or '',
              'run_number': run.get('run_number') or '',
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
          print(json.dumps(values, indent=2))
          PY
      - name: Download encrypted production evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: production-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: encrypted-production
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Decrypt production evidence
        shell: bash
        run: |
          set -euo pipefail
          encrypted="$(find encrypted-production -type f -name '*.tar.gz.enc' -print -quit)"
          [ -n "$encrypted" ] || { echo 'Encrypted production artifact not found' >&2; exit 2; }
          bash scripts/secure_artifact.sh unpack "$encrypted" downloaded-production
      - name: Validate production reporting inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded-production/production/report_summary.json
          test -s downloaded-production/production/canonical_records.json
          test -s downloaded-production/production/academic_job_report.xlsx
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('downloaded-production/production/report_summary.json').read_text(encoding='utf-8'))
          records = json.loads(Path('downloaded-production/production/canonical_records.json').read_text(encoding='utf-8'))
          if not summary.get('run_id'):
              raise SystemExit('Production report summary has no run_id')
          if int(summary.get('records_observed') or 0) <= 0:
              raise SystemExit('Production report summary has no observed records')
          if not isinstance(records, list) or len(records) != int(summary.get('records_observed') or 0):
              raise SystemExit('Canonical record count does not match production report summary')
          print(json.dumps({
              'run_id': summary['run_id'],
              'records_observed': summary.get('records_observed'),
              'current_actionable': summary.get('current_actionable'),
              'today_actionable': summary.get('today_actionable'),
          }, indent=2))
          PY
      - name: Flag missing-shard coverage explicitly
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('downloaded-production/production/production_summary.json').read_text())
          # The production summary nests finalizer diagnostics under core_result.
          missing = (summary.get('core_result') or {}).get('missing_shards') or []
          if missing:
              print('::warning title=Incomplete production coverage::Missing shards: ' + ', '.join(map(str, missing)))
          PY
      - name: Build calibrated clean user-facing Excel and summary
        run: |
          python -m scripts.build_user_excel \
            --records downloaded-production/production/canonical_records.json \
            --base-summary downloaded-production/production/report_summary.json \
            --summary-out clean-report/report_summary.json \
            --output clean-report/international_academic_job_report.xlsx
      - name: Run GPT-6 Luna shadow experiment
        id: llm_shadow
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo 'Missing OPENAI_API_KEY; Rule report is already published, shadow run skipped with failure.' >&2; exit 2; }
          python scripts/run_llm_production_shadow.py \
            --records downloaded-production/production/canonical_records.json \
            --run-id "prod-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}" \
            --output-dir llm-shadow-output \
            --model "${LLM_SHADOW_MODEL}"
      - name: Publish latest LLM shadow report to R2
        if: ${{ steps.llm_shadow.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_llm_shadow_report.py \
            --summary llm-shadow-output/shadow_summary.json \
            --report llm-shadow-output/llm_shadow_report.xlsx \
            --production-run-id "prod-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}" \
            --github-run-id "${{ steps.source.outputs.run_id }}" \
            --github-run-attempt "${{ steps.source.outputs.run_attempt }}" \
            --commit "${{ steps.source.outputs.head_sha }}" \
            --manifest-out llm-shadow-output/r2_report_publish.json
      - name: Build accurate Luna report delivery summary
        if: ${{ steps.llm_shadow.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openpyxl import load_workbook
          original = json.loads(Path('clean-report/report_summary.json').read_text())
          workbook = load_workbook('llm-shadow-output/luna_led_report.xlsx', read_only=True, data_only=True)
          main = workbook['MAIN']
          columns = {cell.value: cell.column - 1 for cell in next(main.iter_rows(min_row=1, max_row=1))}
          data = list(main.iter_rows(min_row=2, values_only=True))
          source_idx = columns['Source Path']
          decision_idx = columns['Luna Decision']
          if any(row[decision_idx] not in ('STRONG_APPLY', 'APPLY', 'REVIEW') for row in data):
              raise SystemExit('Invalid Luna decision in MAIN; refusing cutover')
          counts = {key: sum(row[source_idx] == key for row in data) for key in ('MAIN', 'RESCUE')}
          if sum(counts.values()) != len(data):
              raise SystemExit('Luna MAIN provenance counts do not reconcile')
          original.update({
              'report_variant': 'LUNA_LED_V1',
              'current_actionable': len(data),
              'luna_main_rows': len(data),
              'luna_original_main_rows': counts['MAIN'],
              'luna_rescued_rows': counts['RESCUE'],
              'rule_current_actionable_before_luna': original.get('current_actionable'),
          })
          # The legacy "today_actionable" count is Rule-derived; do not mislabel it.
          original.pop('today_actionable', None)
          Path('llm-shadow-output/luna_led_delivery_summary.json').write_text(
              json.dumps(original, ensure_ascii=False, indent=2) + '\\n')
          workbook.close()
          PY
      - name: Select Luna report when available and prepare fallback
        id: luna_cutover
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.llm_shadow.outcome }}" = "success" ] && [ -s llm-shadow-output/luna_led_report.xlsx ]; then
            echo "variant=LUNA_LED_V1" >> "$GITHUB_OUTPUT"
            echo "report=llm-shadow-output/luna_led_report.xlsx" >> "$GITHUB_OUTPUT"
            echo "summary=llm-shadow-output/luna_led_delivery_summary.json" >> "$GITHUB_OUTPUT"
            echo "Luna-led report selected for user delivery"
          else
            echo "variant=RULE_FALLBACK_V1" >> "$GITHUB_OUTPUT"
            echo "report=clean-report/international_academic_job_report.xlsx" >> "$GITHUB_OUTPUT"
            echo "summary=clean-report/report_summary.json" >> "$GITHUB_OUTPUT"
            echo "::warning title=Luna unavailable::Publishing clearly labeled Rule fallback instead"
          fi
      - name: Publish selected report to authoritative international R2 pointer
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_control_plane_report.py \
            --summary "${{ steps.luna_cutover.outputs.summary }}" \
            --report "${{ steps.luna_cutover.outputs.report }}" \
            --audit-report downloaded-production/production/academic_job_report.xlsx \
            --github-run-id '${{ steps.source.outputs.run_id }}' \
            --github-run-attempt '${{ steps.source.outputs.run_attempt }}' \
            --commit '${{ steps.source.outputs.head_sha }}' \
            --report-variant "${{ steps.luna_cutover.outputs.variant }}" \
            --manifest-out control-plane-publish-evidence.json
      - name: Deliver selected report after a manual production run
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure')) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_SEND_REPORT_ALWAYS: 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.reporting.telegram import send_report

          summary = json.loads(Path('${{ steps.luna_cutover.outputs.summary }}').read_text(encoding='utf-8'))
          report = Path('${{ steps.luna_cutover.outputs.report }}')
          if not report.is_file() or report.stat().st_size == 0:
              raise RuntimeError('Selected report is missing; refusing to report delivery success')
          production_summary = json.loads(Path('downloaded-production/production/production_summary.json').read_text(encoding='utf-8'))
          missing = (production_summary.get('core_result') or {}).get('missing_shards') or []
          send_report(summary, report)
          if missing:
              import os
              import urllib.parse
              import urllib.request
              token = os.environ.get('TELEGRAM_BOT_TOKEN') or ''
              chat_ids = os.environ.get('TELEGRAM_CHAT_IDS') or ''
              if not token or not chat_ids:
                  raise RuntimeError('Missing Telegram configuration for required coverage warning')
              message = ('⚠️ Daily job report was delivered with incomplete source coverage. '
                         'Collector shard artifact upload failed; missing: ' + ', '.join(map(str, missing)) +
                         '. Production workflow remains failed; missing source data was not included.')
              for chat_id in chat_ids.split(','):
                  chat_id = chat_id.strip()
                  if not chat_id:
                      continue
                  data = urllib.parse.urlencode({'chat_id': chat_id, 'text': message}).encode()
                  with urllib.request.urlopen(urllib.request.Request(
                      f'https://api.telegram.org/bot{token}/sendMessage', data=data), timeout=30) as response:
                      payload = json.load(response)
                      if not payload.get('ok'):
                          raise RuntimeError('Telegram coverage warning was not accepted')
          print(json.dumps({'ok': True, 'delivered': True, 'run_id': summary['run_id'], 'missing_shards': missing}))
          PY
      - name: Encrypt LLM shadow review artifact
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [ -d llm-shadow-output ] || exit 0
          mkdir -p secure-artifacts
          bash scripts/secure_artifact.sh pack \
            "." \
            "secure-artifacts/llm-shadow-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}.tar.gz.enc" \
            "llm-shadow-output"
      - name: Upload encrypted LLM shadow review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: llm-shadow-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: secure-artifacts/llm-shadow-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}.tar.gz.enc
          retention-days: 21
          if-no-files-found: ignore
      - name: Report shadow status without changing Rule authority
        if: ${{ always() }}
        shell: bash
        run: |
          echo "LLM shadow step outcome: ${{ steps.llm_shadow.outcome }}"
          if [ -s llm-shadow-output/shadow_summary.json ]; then
            cat llm-shadow-output/shadow_summary.json
          fi
          echo "Rule production state/report remains authoritative regardless of the shadow outcome."
