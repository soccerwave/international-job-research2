name: AcademicPositions Reader Proxy Probe

on:
  push:
    branches:
      - diag/academicpositions-reader-proxy-v2
    paths:
      - '.github/workflows/academicpositions-reader-proxy.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public reader proxies
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request

          targets=[
              ("jina_https","https://r.jina.ai/http://https://academicpositions.com/jobs/country/germany"),
              ("jina_http","https://r.jina.ai/http://academicpositions.com/jobs/country/germany"),
          ]
          results=[]
          for name,url in targets:
              req=urllib.request.Request(url,headers={
                  "User-Agent":"Mozilla/5.0 (compatible; academic-job-monitor/1.0)",
                  "Accept":"text/plain,text/markdown,*/*"
              })
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      body=r.read().decode("utf-8","replace")
                      results.append({
                          "name":name,
                          "status":r.status,
                          "content_type":r.headers.get("content-type"),
                          "length":len(body),
                          "challenge":any(x in body.lower() for x in ("just a moment","cf-chl-","checking your browser")),
                          "jobs_heading":bool(re.search(r"\b\d+\s+jobs?\s+in\s+germany\b",body,re.I)),
                          "ad_urls":len(set(re.findall(r"https?://academicpositions\.com/ad/[^\s)\]]+",body,re.I))),
                          "prefix":body[:500].replace("\n"," ")
                      })
              except Exception as exc:
                  results.append({"name":name,"error":f"{type(exc).__name__}: {exc}"})
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
