name: R2 State Backup Retention

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Actually delete retention candidates; false is a safe dry-run
        required: true
        default: false
        type: boolean
      max_age_days:
        description: Delete production backups older than this age, except protected latest generations
        required: true
        default: '7'
        type: string
      keep_latest:
        description: Always protect at least this many newest production generations
        required: true
        default: '3'
        type: string

permissions:
  contents: read

concurrency:
  group: r2-state-backup-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-cloud.txt
      - name: Run retention regression tests
        run: python -m unittest tests.test_r2_retention -v
      - name: Preview or apply R2 state backup retention
        shell: bash
        env:
          APPLY: ${{ inputs.apply }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
          KEEP_LATEST: ${{ inputs.keep_latest }}
        run: |
          set -euo pipefail
          args=(--max-age-days "$MAX_AGE_DAYS" --keep-latest "$KEEP_LATEST")
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          fi
          python scripts/prune_r2_state_backups.py "${args[@]}"
