name: R2 Storage Inventory (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-storage-inventory-readonly
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R2 client dependencies
        run: python -m pip install --disable-pip-version-check boto3
      - name: Inventory R2 objects without mutation
        run: python scripts/audit_r2_bucket_inventory.py > r2-inventory.json
      - name: Upload inventory report
        uses: actions/upload-artifact@v4
        with:
          name: r2-storage-inventory
          path: r2-inventory.json
          retention-days: 14
          if-no-files-found: error
