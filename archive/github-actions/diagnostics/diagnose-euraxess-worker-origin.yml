name: EURAXESS controlled origin 403 diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EURAXESS_WORKER_URL: ${{ vars.EURAXESS_WORKER_URL }}
      EURAXESS_WORKER_TOKEN: ${{ secrets.EURAXESS_WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: PYTHONPATH=. python scripts/diagnose_euraxess_worker_origin.py
