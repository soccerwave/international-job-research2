name: Diagnose EURAXESS public access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check EURAXESS access without retries or sensitive headers
        run: python scripts/diagnose_euraxess_access.py
